<div class="field-row">
    <div class="form-group field-input-group">
        <label for="{{ field_id }}" class="field-label">
            {{ field_config.label }}
            {% if field_config.tooltip %}
            <span class="tooltip">ℹⓘ<i class="fas fa-info-circle"></i><span class="tooltiptext">{{ field_config.tooltip }}</span></span>
            {% endif %}
        </label>
        
        <div class="field-input-container">
            {% if field_config.type == 'number' and field_config.unit %}
            <div class="input-with-unit">
                <input type="number" 
                       name="{{ section }}_{{ field_name }}" 
                       id="{{ field_id }}"
                       value="{{ field_config.default }}" 
                       step="any"
                       class="form-input">
                <span class="unit">{{ field_config.unit }}</span>
            </div>
            {% elif field_config.type == 'select' %}
            <select name="{{ section }}_{{ field_name }}" 
                    id="{{ field_id }}"
                    class="form-input">
                {% for option in field_config.options %}
                <option value="{{ option }}" 
                        {% if field_config.default == option %}selected{% endif %}>
                    {{ option }}
                </option>
                {% endfor %}
            </select>
            {% elif field_config.type == 'checkbox' %}
            <label class="checkbox-label">
                <input type="checkbox" 
                       name="{{ section }}_{{ field_name }}" 
                       id="{{ field_id }}"
                       class="form-checkbox"
                       value="{{ field_config.value }}"
                       {% if field_config.default %}checked{% endif %}>
                <span class="checkbox-custom"></span>
            </label>
            {% elif field_config.type == 'date' %}
            <input type="date" 
                   name="{{ section }}_{{ field_name }}" 
                   id="{{ field_id }}"
                   class="form-input"
                   value="{{ field_config.default }}">
            {% else %}
            <input type="{{ field_config.type }}" 
                   name="{{ section }}_{{ field_name }}" 
                   id="{{ field_id }}"
                   class="form-input"
                   value="{{ field_config.default }}">
            {% endif %}
            
            <button type="button" class="remove-btn" title="Удалить поле">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>
</div>
